name: Build site from CMS content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'images/uploads/**'
      - 'build.py'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: pip install pillow
      - name: Check content (nothing is published if this fails)
        run: python build.py --check
      - name: Build the pages
        run: python build.py
      - name: Save the rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No page changes to save."
          else
            git commit -m "Rebuild site from CMS content"
            git pull --rebase
            git push
          fi
