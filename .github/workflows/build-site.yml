name: Build site from CMS content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'images/uploads/**'
      - 'build.py'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: pip install pillow
      - name: Build and save the pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python build.py --check
            python build.py
            git add -A -- '*.html' sitemap.xml robots.txt
            if git diff --cached --quiet; then
              echo "No page changes to save."
              exit 0
            fi
            git commit -m "Rebuild site from CMS content"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Another change arrived first. Starting again from the newest version."
            sleep 3
          done
          echo "Could not save after several tries."
          exit 1
